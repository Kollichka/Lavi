    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Иконка сайта (Сакура) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        /* ============ БАЗА ============ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            color: #4a405c;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #e8dcf5;
        }

        /* Фон с облаками */
        .bg-image {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: url('https://images.unsplash.com/photo-1534088568595-a066f410cbda?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(1.1) contrast(0.9) opacity(0.8);
        }

        /* Пастельный оверлей */
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, rgba(240, 220, 255, 0.6), rgba(220, 235, 255, 0.6), rgba(255, 220, 240, 0.6));
            pointer-events: none;
        }

        /* Летающие звездочки */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px #fff;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-100px) scale(0.5);
                opacity: 0;
            }
        }

        /* ============ ПАДАЮЩИЕ ЛЕПЕСТКИ САКУРЫ ============ */
        .petals-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -20px;
            background: linear-gradient(135deg, #ffd6f0, #ffb3d9);
            border-radius: 15px 0 15px 0; /* Форма лепестка */
            box-shadow: 0 0 5px rgba(255, 200, 230, 0.4);
            opacity: 0.8;
            animation: fall linear infinite, sway ease-in-out infinite alternate;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh);
            }

            100% {
                transform: translateY(110vh);
            }
        }

        @keyframes sway {
            0% {
                margin-left: 0px;
            }

            100% {
                margin-left: 50px;
            }
        }

        /* ============ ЭКРАН ВХОДА ============ */
        #intro-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(230, 220, 245, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.8s ease;
        }

            #intro-screen.hidden {
                opacity: 0;
                pointer-events: none;
            }

        .intro-text {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: #6a5a7f;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .enter-btn {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            color: #5a4b6e;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(150, 130, 180, 0.2);
            transition: all 0.3s ease;
        }

            .enter-btn:hover {
                background: rgba(255, 255, 255, 0.7);
                transform: scale(1.05);
            }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        /* ============ ИКОНКА ЗВУКА СВЕРХУ СЛЕВА ============ */
        .sound-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 50;
            transition: background 0.3s;
            color: #5a4b6e;
        }

            .sound-toggle:hover {
                background: rgba(255, 255, 255, 0.5);
            }

            .sound-toggle svg {
                width: 20px;
                height: 20px;
                fill: currentColor;
            }

        /* ============ ОСНОВНОЙ КОНТЕЙНЕР ============ */
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 540px;
            padding: 20px;
            z-index: 10;
        }

        /* ============ ГЛАВНАЯ КАРТОЧКА (Профиль) ============ */
        .profile-card {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(150, 130, 180, 0.15);
            position: relative;
        }

        /* Аватарка */
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #d3c4ff, #bfe3ff 50%, #ffc9e6);
            box-shadow: 0 8px 24px rgba(150, 130, 210, 0.3);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

            .avatar-container:hover {
                transform: scale(1.05);
            }

            .avatar-container img {
                width: 100%;
                height: 100%;
                border-radius: 50%;
                object-fit: cover;
                background: #fff;
                display: block;
            }

        /* Имя и подпись */
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 600;
            color: #4a405c;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            font-family: 'Great Vibes', cursive;
            font-size: 20px;
            color: #6a5a7f;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* Иконки соцсетей */
        .socials {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

            .socials a {
                color: #5a4b6e;
                transition: transform 0.2s ease, color 0.2s;
                display: flex;
                justify-content: center;
                align-items: center;
            }

                .socials a:hover {
                    transform: translateY(-3px);
                    color: #8c71d9;
                }

            .socials svg {
                width: 24px;
                height: 24px;
                fill: currentColor;
            }

        /* Счётчик просмотров */
        .views {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #6a5a7f;
            opacity: 0.8;
        }

            .views svg {
                width: 14px;
                height: 14px;
                fill: currentColor;
            }

        /* ============ МУЗЫКАЛЬНЫЙ ПЛЕЕР ============ */
        .player-card {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(150, 130, 180, 0.15);
        }

        .album-art {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #fff;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .player-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .track-title {
            font-size: 13px;
            font-weight: 600;
            color: #4a405c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Полоса прогресса и время */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #6a5a7f;
            font-variant-numeric: tabular-nums;
        }

        /* Стилизация Range Input (ползунков) */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
            width: 100%;
        }

            input[type=range]:focus {
                outline: none;
            }

            /* Трек ползунка */
            input[type=range]::-webkit-slider-runnable-track {
                width: 100%;
                height: 3px;
                background: rgba(255, 255, 255, 0.5);
                border-radius: 2px;
            }

            input[type=range]::-moz-range-track {
                width: 100%;
                height: 3px;
                background: rgba(255, 255, 255, 0.5);
                border-radius: 2px;
            }

            /* Кружок ползунка */
            input[type=range]::-webkit-slider-thumb {
                -webkit-appearance: none;
                height: 8px;
                width: 8px;
                border-radius: 50%;
                background: #8c71d9;
                margin-top: -2.5px;
                box-shadow: 0 0 4px rgba(140, 113, 217, 0.5);
                transition: transform 0.1s;
            }

                input[type=range]::-webkit-slider-thumb:hover {
                    transform: scale(1.3);
                }

            input[type=range]::-moz-range-thumb {
                height: 8px;
                width: 8px;
                border-radius: 50%;
                background: #8c71d9;
                border: none;
            }

        /* Контейнер громкости */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 80px;
        }

            .volume-container svg {
                width: 14px;
                height: 14px;
                fill: #6a5a7f;
                cursor: pointer;
            }

            .volume-container input[type=range] {
                width: 100%;
            }

        /* Кнопки управления */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .controls button {
                background: none;
                border: none;
                cursor: pointer;
                color: #5a4b6e;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                transition: color 0.2s;
            }

                .controls button:hover {
                    color: #8c71d9;
                }

            .controls svg {
                width: 16px;
                height: 16px;
                fill: currentColor;
            }

            .controls .play-btn svg {
                width: 20px;
                height: 20px;
            }

        /* Адаптив */
        @media (max-width: 540px) {
            .container {
                padding: 15px;
            }

            .profile-card {
                padding: 30px 20px 25px;
            }

            .name {
                font-size: 22px;
            }

            .player-card {
                padding: 10px 12px;
                gap: 10px;
                flex-wrap: wrap;
            }

            .volume-container {
                width: 60px;
            }
        }
    </style>
</head>

           НАСТРОЙКИ

const ALBUM_COVER = "https://images.unsplash.com/photo-1490750967868-88cb44cb2753?q=80&w=100&auto=format&fit=crop";

/* =====================================================
           ЭЛЕМЕНТЫ ИНТЕРФЕЙСА

const enterBtn    = document.getElementById('enter-btn');

const playBtn     = document.getElementById('play-btn');
const iconPlay    = document.getElementById('icon-play');

const timeCurrent = document.getElementById('time-current');

const volIcon     = document.getElementById('vol-icon');
const mainAvatar  = document.getElementById('main-avatar');

// Настройка аудио
bgm.src = MUSIC_SRC;
bgm.volume = 0.5;
volumeBar.value = 0.5;
document.getElementById('track-name').textContent = TRACK_TITLE;
document.querySelector('.album-art').src = ALBUM_COVER;

// Счётчик просмотров
let views = localStorage.getItem('page_views') || 0;
views = parseInt(views) + 1;
localStorage.setItem('page_views', views);
document.getElementById('views-count').textContent = views;

/* =====================================================
           ЗАГРУЗКА АВАТАРКИ (Fallback, если Unavatar не ответит)
           ===================================================== */
// Запасная картинка (цветочек), если аватарка из ТГ не загрузится
const svgFallback = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3c4ff"/><stop offset="1" stop-color="#ffc9e6"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50" y="66" font-size="44" text-anchor="middle" fill="#fff">✿</text></svg>`);

mainAvatar.onerror = () => {
          mainAvatar.onerror = null;
          mainAvatar.src = svgFallback;
};

/* =====================================================
           СТАРТ И МУЗЫКА
           ===================================================== */
enterBtn.addEventListener('click', () => {
          introScreen.classList.add('hidden');
          bgm.play().then(() => {
            updatePlayState();
          }).catch(err => {
            console.log("Ошибка воспроизведения:", err);
          });
});

/* =====================================================
           УПРАВЛЕНИЕ ПЛЕЕРОМ
           ===================================================== */
function updatePlayState() {
          if (bgm.paused) {
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
          } else {
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
          }
}

playBtn.addEventListener('click', () => {
          if (bgm.paused) bgm.play();
          else bgm.pause();
          updatePlayState();
});

document.getElementById('prev-btn').addEventListener('click', () => {
          bgm.currentTime = 0;
          if (bgm.paused) { bgm.play(); updatePlayState(); }
});

// Время
function formatTime(seconds) {
          if (isNaN(seconds)) return "0:00";
          const m = Math.floor(seconds / 60);
          const s = Math.floor(seconds % 60);
          return `${m}:${s < 10 ? '0' : ''}${s}`;
}

bgm.addEventListener('timeupdate', () => {
          timeCurrent.textContent = formatTime(bgm.currentTime);
          if (bgm.duration) {
            timeTotal.textContent = formatTime(bgm.duration);
            const percent = (bgm.currentTime / bgm.duration) * 100;
            seekBar.value = percent;
            seekBar.style.background = `linear-gradient(to right, #8c71d9 ${percent}%, rgba(255,255,255,0.5) ${percent}%)`;
          }
});

bgm.addEventListener('loadedmetadata', () => {
          timeTotal.textContent = formatTime(bgm.duration);
});

seekBar.addEventListener('input', () => {
          if (bgm.duration) {
            bgm.currentTime = (seekBar.value / 100) * bgm.duration;
          }
});

/* =====================================================
           ГРОМКОСТЬ
           ===================================================== */
volumeBar.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          bgm.volume = val;

          if (val > 0 && bgm.muted) {
            bgm.muted = false;
            updateSoundIcons(false);
          }
          updateVolumeBarStyle(val);
});

let isMuted = false;
soundBtn.addEventListener('click', () => {
          isMuted = !isMuted;
          bgm.muted = isMuted;
          updateSoundIcons(isMuted);

          if (isMuted) {
            volumeBar.value = 0;
            updateVolumeBarStyle(0);
          } else {
            volumeBar.value = bgm.volume;
            updateVolumeBarStyle(bgm.volume);
          }
});

volIcon.addEventListener('click', () => {
          soundBtn.click();
});

function updateSoundIcons(muted) {
          if (muted) {
            iconOn.style.display = 'none';
            iconOff.style.display = 'block';
          } else {
            iconOn.style.display = 'block';
            iconOff.style.display = 'none';
          }
}

function updateVolumeBarStyle(val) {
          const percent = val * 100;
          volumeBar.style.background = `linear-gradient(to right, #8c71d9 ${percent}%, rgba(255,255,255,0.5) ${percent}%)`;
}
updateVolumeBarStyle(0.5);

/* =====================================================
           ГЕНЕРАЦИЯ ЗВЕЗДОЧЕК И ЛЕПЕСТКОВ
           ===================================================== */
const starsContainer = document.getElementById('stars-container');
for (let i = 0; i < 30; i++) {
          const star = document.createElement('div');
          star.classList.add('star');
          const size = Math.random() * 3 + 1;
          star.style.width = size + 'px';
          star.style.height = size + 'px';
          star.style.left = Math.random() * 100 + 'vw';
          star.style.top = Math.random() * 100 + 'vh';
          star.style.animationDuration = (Math.random() * 4 + 3) + 's';
          star.style.animationDelay = (Math.random() * 5) + 's';
          starsContainer.appendChild(star);
}

const petalsContainer = document.getElementById('petals-container');
function createPetal() {
          const petal = document.createElement('div');
          petal.classList.add('petal');

          const size = Math.random() * 8 + 8;
          petal.style.width = size + 'px';
          petal.style.height = size + 'px';
          petal.style.left = Math.random() * 100 + 'vw';

          const fallDuration = Math.random() * 6 + 6;
          petal.style.animationDuration = `${fallDuration}s, ${Math.random() * 2 + 2}s`;
          petal.style.animationDelay = `0s, ${Math.random() * 2}s`;
          petal.style.opacity = Math.random() * 0.5 + 0.4;

          petalsContainer.appendChild(petal);

          setTimeout(() => {
            petal.remove();
          }, fallDuration * 1000);
}

setInterval(createPetal, 400);
for(let i=0; i<10; i++) setTimeout(createPetal, i * 200);
    </script>
</body>
</html>
